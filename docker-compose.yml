services:
  api:
    build: .
    command: uv run uvicorn webhook_relay.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: uv run arq webhook_relay.worker.settings.WorkerSettings
    env_file:
      - .env
    restart: unless-stopped

  mock-receiver:
    build: .
    command: uv run uvicorn mock_receiver.app:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"
    environment:
      MOCK_RECEIVER_SECRET: demo-secret
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webhook_relay_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis-test:
    image: redis:7-alpine
    profiles: ["test"]
    ports:
      - "6380:6379"
